<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorLink | Architectural Hyper-Premium Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --text: #ffffff; --accent: #00ffff;
            --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .bg-grid {
            position: fixed; inset: 0;
            background-image: linear-gradient(var(--accent) 0.5px, transparent 0.5px), linear-gradient(90deg, var(--accent) 0.5px, transparent 0.5px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(60deg) translateY(-150px);
            opacity: 0.1; pointer-events: none; z-index: -1; animation: grid-sc 30s linear infinite;
        }
        @keyframes grid-sc { from { background-position: 0 0; } to { background-position: 0 600px; } }

        nav { padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; background: rgba(5,5,5,0.8); backdrop-filter: blur(30px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); letter-spacing: -0.05em; text-transform: uppercase; cursor: pointer; }
        .nav-links a { margin-left: 2.5rem; text-decoration: none; color: white; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; transition: 0.3s; opacity: 0.6; }
        .nav-links a:hover { opacity: 1; color: var(--accent); }

        .container { max-width: 1300px; margin: 0 auto; padding: 8rem 2rem; }
        h1 { font-size: clamp(2.5rem, 8vw, 6rem); font-weight: 900; line-height: 0.95; letter-spacing: -0.05em; margin-bottom: 2rem; text-transform: uppercase; }
        
        .card-3d { 
            background: var(--glass); border: 1px solid var(--border); padding: 3rem; 
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1); transform-style: preserve-3d;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 2rem;
        }
        .card-3d:hover { 
            transform: translateY(-20px) rotateX(10deg) rotateY(-10deg); 
            border-color: var(--accent); box-shadow: 0 50px 100px rgba(0,255,255,0.1);
        }
        .card-3d img { width: 100%; height: 260px; object-fit: cover; filter: grayscale(1) brightness(0.6); transition: 0.6s; transform: translateZ(30px); }
        .card-3d:hover img { filter: grayscale(0) brightness(1); }

        .btn-mag {
            padding: 1.2rem 3rem; background: transparent; border: 1px solid var(--accent); color: var(--accent);
            font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
            transition: 0.4s; font-size: 0.75rem; text-decoration: none; display: inline-block;
        }
        .btn-mag:hover { background: var(--accent); color: black; transform: scale(1.05); }

        .source-overlay {
            position: fixed; left: 2rem; top: 1.5rem; bottom: 2rem; width: 420px;
            background: rgba(0,0,0,0.95); border: 1px solid var(--accent); padding: 2.5rem;
            z-index: 2000; font-family: 'Courier New', monospace; box-shadow: 0 0 100px rgba(0,255,255,0.1);
            animation: sl-in 0.5s forwards;
        }
        @keyframes sl-in { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .tg-box { position: fixed; top: 1.5rem; right: 4rem; z-index: 2100; display: flex; align-items: center; gap: 1rem; color: #fff; }
        .sw { width: 44px; height: 22px; background: #222; border-radius: 22px; position: relative; cursor: pointer; border: 1px solid #444; }
        .sw.active { background: var(--accent); }
        .hd { width: 16px; height: 16px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 3px; transition: 0.3s; }
        .sw.active .hd { left: 23px; background: #000; }

        .fade-i { animation: fi 0.8s forwards; }
        @keyframes fi { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CODE_MAP = {
            login: { url: 'POST /api/auth/login', code: '@PostMapping("/login")\npublic ResponseEntity authenticate(@RequestBody LoginRequest req) {\n  return ResponseEntity.ok(userService.validate(req));\n}' },
            tutors: { url: 'GET /api/tutors', code: '@GetMapping\npublic List<User> getTutors() {\n  return userRepository.findByRole(Role.TUTOR);\n}' },
            booking: { url: 'POST /api/bookings', code: '@PostMapping\npublic Booking create(@RequestBody Booking b) {\n  return bookingRepository.save(b);\n}' },
            sys: { url: 'GET /api/system/arch', code: '@GetMapping("/architecture")\npublic Map getArch() {\n  return service.getMetadata();\n}' }
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [isSrc, setIsSrc] = useState(false);
            const [src, setSrc] = useState(CODE_MAP.login);
            const [tutors, setTutors] = useState([
                { id: 1, name: 'Siva Charan', subject: 'Java Architecture', rate: 75, bio: 'Expert Java Developer. Specializing in Low-Level Threading & Spring Boot.', image: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400' },
                { id: 2, name: 'Varsith', subject: 'Python AI Engine', rate: 65, bio: 'ML Architect and Python expert. Expert in scalable neural engines.', image: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400' }
            ]);

            const updSrc = (k) => { setSrc(CODE_MAP[k]); };

            const handleLogin = (e) => {
                e.preventDefault();
                if (e.target.email.value === 'sample123@gmail.com' && e.target.password.value === '123456') {
                    setTimeout(() => { setView('home'); updSrc('sys'); }, 400);
                } else { alert('Invalid.'); }
            };

            return (
                <div style={{minHeight:'100vh'}}>
                    <div className="bg-grid"></div>

                    {view !== 'login' && (
                        <div className="tg-box">
                            <span style={{fontSize:'0.65rem', fontWeight:'900', color:isSrc?'#0ff':'#444'}}>SOURCE MODE</span>
                            <div className={`sw ${isSrc?'active':''}`} onClick={()=>setIsSrc(!isSrc)}>
                                <div className="hd"></div>
                            </div>
                        </div>
                    )}

                    {isSrc && (
                        <div className="source-overlay">
                            <h4 style={{color:'#0ff', marginBottom:'1.5rem'}}>ARCHITECTURAL LOGIC</h4>
                            <div style={{marginBottom:'2rem'}}>
                                <div style={{color:'#444', fontSize:'0.6rem', marginBottom:'0.3rem'}}>REST ENDPOINT</div>
                                <div style={{padding:'0.6rem', background:'#111', fontSize:'0.75rem', color:'#0ff'}}>{src.url}</div>
                            </div>
                            <div>
                                <div style={{color:'#444', fontSize:'0.6rem', marginBottom:'0.3rem'}}>JAVA CONTROLLER</div>
                                <pre style={{padding:'1rem', background:'#080808', borderLeft:'2px solid #0ff', fontSize:'0.65rem', color:'#888', whiteSpace:'pre-wrap'}}>{src.code}</pre>
                            </div>
                        </div>
                    )}

                    {view !== 'login' && (
                        <nav style={{paddingRight: '12rem'}}>
                            <div className="logo" onClick={() => setView('home')}>TutorLink</div>
                            <div className="nav-links">
                                <a href="#" onClick={() => { setView('tutors'); updSrc('tutors'); }}>Tutors</a>
                                <a href="#" onClick={() => { setView('about'); updSrc('sys'); }}>Architecture</a>
                                <a href="https://twss.netlify.app/contact" target="_blank">Support</a>
                                <button style={{background:'transparent', border:'none', color:'#0ff', cursor:'pointer', fontWeight:'800', marginLeft:'1.5rem'}} onClick={() => { setView('login'); updSrc('login'); }}>EXIT</button>
                            </div>
                        </nav>
                    )}

                    <main className="container" style={{paddingLeft: isSrc?'480px':'2rem', transition:'0.5s'}}>
                        {view === 'login' && (
                            <div className="fade-i" style={{maxWidth: '450px', margin: '7vh auto'}}>
                                <div className="card-3d" style={{padding: '4rem'}}>
                                    <h2 style={{fontSize:'3rem', marginBottom:'3rem'}}>PORTAL</h2>
                                    <form onSubmit={handleLogin}>
                                        <input name="email" type="email" placeholder="sample123@gmail.com" required style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid #333', color:'#fff', padding:'1rem 0', marginBottom:'1.5rem', outline:'none'}} />
                                        <input name="password" type="password" placeholder="123456" required style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid #333', color:'#fff', padding:'1rem 0', marginBottom:'3rem', outline:'none'}} />
                                        <button className="btn-mag" style={{width: '100%', background:'#fff', color:'#000'}}>Sign In</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'home' && (
                            <div className="fade-i">
                                <h1>Architectural <br/> Engineering.</h1>
                                <p style={{fontSize:'1.6rem', color:'rgba(255,255,255,0.4)', marginBottom:'4rem', maxWidth:'700px'}}>Connect with expert tutors and manage learning with deep architectural transparency.</p>
                                <div style={{display:'flex', gap:'2rem'}}>
                                    <button className="btn-mag" onClick={() => { setView('tutors'); updSrc('tutors'); }}>Get Started</button>
                                    <button className="btn-mag" style={{borderColor:'#fff', color:'#fff'}} onClick={() => setView('about')}>Our Story</button>
                                </div>
                            </div>
                        )}

                        {view === 'tutors' && (
                            <div className="fade-i">
                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'4rem'}}>
                                    <h2 style={{fontSize:'3rem'}}>Faculty</h2>
                                    <button className="btn-mag" onClick={()=>setView('add-tutor')}>Join as Tutor</button>
                                </div>
                                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(320px, 1fr))', gap:'4rem'}}>
                                    {tutors.map(t => (
                                        <div key={t.id} className="card-3d">
                                            <img src={t.image} style={{width:'100%', height:'240px', objectFit:'cover'}} />
                                            <h3 style={{marginTop:'2rem', color:'#0ff'}}>{t.name}</h3>
                                            <p style={{fontWeight:'900', margin:'0.8rem 0'}}>{t.subject}</p>
                                            <p style={{opacity:0.5, fontSize:'0.85rem', marginBottom:'2.5rem', minHeight:'3.5rem'}}>{t.bio}</p>
                                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                                <strong>${t.rate}/HR</strong>
                                                <button className="btn-mag" style={{padding:'0.8rem 1.5rem'}} onClick={() => { updSrc('booking'); alert('Success.'); }}>Book</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'add-tutor' && (
                            <div className="fade-i" style={{maxWidth:'600px'}}>
                                <h2>Apply as Tutor</h2>
                                <div className="card-3d" style={{marginTop:'3rem'}}>
                                    <form onSubmit={(e)=>{e.preventDefault(); setTutors([{id:Date.now(), name:e.target.n.value, subject:e.target.s.value, rate:e.target.r.value, bio:e.target.b.value, image:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400'}, ...tutors]); setView('tutors');}}>
                                        <input name="n" placeholder="Name" required style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid #333', color:'#fff', padding:'1rem 0', marginBottom:'1.5rem', outline:'none'}} />
                                        <input name="s" placeholder="Expertise" required style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid #333', color:'#fff', padding:'1rem 0', marginBottom:'1.5rem', outline:'none'}} />
                                        <input name="r" type="number" placeholder="Rate" required style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid #333', color:'#fff', padding:'1rem 0', marginBottom:'1.5rem', outline:'none'}} />
                                        <textarea name="b" placeholder="Bio" required style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid #333', color:'#fff', padding:'1rem 0', marginBottom:'3rem', outline:'none', minHeight:'80px'}} />
                                        <button className="btn-mag" style={{width:'100%'}}>Apply</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
